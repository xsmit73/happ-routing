name: update-routing

on:
  schedule:
    - cron: "23 */6 * * *"   # каждые 6 часов
  workflow_dispatch:           # кнопка «Run workflow»
  push:
    paths: ["custom.json", "build.py"]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build profile
        run: python3 build.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain -- happ-routing.json happ-routing.deeplink)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add happ-routing.json happ-routing.deeplink
            git commit -m "update routing profile"
            git push
          else
            echo "Nothing to commit"
          fi

      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
